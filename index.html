// Azimuthal map centered on the player, oriented like the main view (ahead = down).
function drawMinimap(){
  const S = 104, c = S/2, rad = c*0.96;
  mmCtx.clearRect(0,0,S,S);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(c,c,c,0,Math.PI*2); mmCtx.clip();
  mmCtx.fillStyle = (MAP_CONFIGS[currentMap] || MAP_CONFIGS.grass).bg;
  mmCtx.fillRect(0,0,S,S);
  _q.crossVectors(camP, camT);
  const project = (v, out)=>{
    const th = Math.acos(clamp(v.dot(camP), -1, 1));
    const f = v.dot(camT), l = v.dot(_q);
    const m = Math.hypot(f,l) || 1;
    const r = th/Math.PI*rad;
    out[0] = c + l/m*r; out[1] = c + f/m*r;
    return out;
  };
  const pt = [0,0];
  mmCtx.fillStyle = 'rgba(120,112,100,0.9)';
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    project(o.c, pt);
    mmCtx.beginPath(); mmCtx.arc(pt[0], pt[1], Math.max(1.6, o.boundingR/R/Math.PI*rad), 0, Math.PI*2); mmCtx.fill();
  }
  // what the camera currently sees: a cap centered a little ahead of the player
  const horizon = Math.acos(R / camDist);
  mmCtx.strokeStyle = 'rgba(234,230,214,0.4)';
  mmCtx.beginPath();
  mmCtx.arc(c, c + LAMBDA/Math.PI*rad, horizon/Math.PI*rad, 0, Math.PI*2);
  mmCtx.stroke();
  const t = world.time;
  for(const [pu, kind] of [[boostPickup,'boost'],[invisPickup,'invis'],[bladePickup,'blade']]){
    if(!pu) continue;
    project(pu.p, pt);
    const pr = 4.6 + Math.sin(t*6)*1;
    mmCtx.fillStyle = POWER_COLORS[kind].main; mmCtx.strokeStyle = '#fff'; mmCtx.lineWidth = 1.6;
    mmCtx.beginPath(); mmCtx.moveTo(pt[0], pt[1]-pr); mmCtx.lineTo(pt[0]+pr, pt[1]); mmCtx.lineTo(pt[0], pt[1]+pr); mmCtx.lineTo(pt[0]-pr, pt[1]); mmCtx.closePath();
    mmCtx.fill(); mmCtx.stroke();
  }
  if(me && me.alive && me.segN > 2){
    mmCtx.strokeStyle = me.color; mmCtx.globalAlpha = 0.55; mmCtx.lineWidth = 2;
    mmCtx.beginPath();
    for(let i=0;i<me.segN;i+=3){ project(me.cachedSegs[i], pt); if(i===0) mmCtx.moveTo(pt[0],pt[1]); else mmCtx.lineTo(pt[0],pt[1]); }
    mmCtx.stroke(); mmCtx.globalAlpha = 1;
  }
  for(let i=0;i<players.length;i++){
    const p = players[i];
    if(!p.alive) continue;
    project(p.p, pt);
    mmCtx.fillStyle = p.color;
    mmCtx.beginPath(); mmCtx.arc(pt[0], pt[1], p===me?3.2:2.3, 0, Math.PI*2); mmCtx.fill();
  }
  mmCtx.restore();
}

/* ============================== GAME LOOP ============================== */
let lastT = performance.now();
let boardTimer = 0;
let perfAcc = 0, perfN = 0, lastAdapt = 0;
function adaptResolution(avgMs){
  const t = performance.now();
  if(avgMs > 26 && resScale > 0.55 && t - lastAdapt > 1200){ resScale = Math.max(0.55, resScale - 0.12); lastAdapt = t; applyPixelRatio(); }
  else if(avgMs < 17.8 && resScale < 1 && t - lastAdapt > 7000){ resScale = Math.min(1, resScale + 0.06); lastAdapt = t; applyPixelRatio(); }
}
function loop(now){
  const raw = now - lastT;
  const dt = Math.min(0.05, raw/1000);
  lastT = now;
  requestAnimationFrame(loop);
  if(!running) return;
  if(raw < 1500){ perfAcc += raw; perfN++; if(perfN >= 40 || (perfAcc > 1200 && perfN >= 6)){ adaptResolution(perfAcc/perfN); perfAcc = 0; perfN = 0; } }
  simStep(dt, true);
  profileTick(dt);
  renderFrame(dt);
}
// one tick of game logic (also used by the test hook to fast-forward)
function simStep(dt, withInput){
  world.time += dt;
  if(withInput && me.alive){ me.steer = readSteer(); me.speedInput = readSpeed(); }
  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive){
      if(world.time >= s.respawnAt){ s.reset(); if(s===me) { /* camera glides to the new spot */ } }
      continue;
    }
    if(s.isAI) updateAI(s, dt);
    s.update(dt);
    s.cachedSegs = s.segments();
  }
  updateObstacles(dt, world.time);
  checkCollisions();
  checkFood();
  updatePickupSpawns(dt);
  checkPickups();
  updateMoles(dt, world.time);
  updateFx(dt);
}
function renderFrame(dt){
  updateCameraRig(dt);
  updateToast(dt);

  if(me.deathFlash > 0) myFlash = me.deathFlash;
  if(myFlash > 0){ deathFlashEl.style.opacity = (myFlash*0.35).toFixed(2); myFlash -= dt; }
  else deathFlashEl.style.opacity = 0;

  // ---- render ----
  terrainUniforms.uTime.value = world.time;
  shadowN = 0; _bodyN = 0; _ghostN = 0;
  updateFoodMeshes(world.time);
  updatePickupMeshes(world.time);
  for(let i=0;i<players.length;i++) players[i].render(world.time);
  flushSnakeInstances();
  renderer.render(scene, camera);

  drawMinimap();
  boardTimer -= dt;
  if(boardTimer <= 0){ boardTimer = 0.25; updateBoard(); }
  updateFxChips();
}
requestAnimationFrame(loop);

/* Small live preview of the chosen color + head style on the start screen */
const previewCanvas = document.getElementById('previewCanvas');
const pctx = previewCanvas.getContext('2d');
const PREVIEW_W = 240, PREVIEW_H = 104;
let previewT0 = performance.now();

function drawPreview(){
  const tSec = (performance.now()-previewT0)/1000;
  pctx.clearRect(0,0,PREVIEW_W,PREVIEW_H);

  // Build a gentle S-curve spine so the preview shows off the real body
  // shape (tapered ribbon), not just a straight row of circles.
  const n = 16;
  const headR = 15;
  const wiggle = Math.sin(tSec*1.1)*8;
  const segs = [];
  for(let i=0;i<n;i++){
    const u = i/(n-1);
    const x = PREVIEW_W-40 - u*(PREVIEW_W-70);
    const y = PREVIEW_H/2 + Math.sin(u*3.1+tSec*0.6)*14 + wiggle*(1-u)*0.3;
    segs.push({x,y});
  }
  const left = new Array(n), right = new Array(n);
  for(let i=0;i<n;i++){
    const p = segs[i];
    let tx,ty;
    if(i===0){ const q=segs[1]; tx=q.x-p.x; ty=q.y-p.y; }
    else if(i===n-1){ const q=segs[i-1]; tx=p.x-q.x; ty=p.y-q.y; }
    else { const a=segs[i-1], b=segs[i+1]; tx=b.x-a.x; ty=b.y-a.y; }
    const tl = Math.hypot(tx,ty)||1;
    const nx=-ty/tl, ny=tx/tl;
    const rad = i===0 ? headR*0.86 : segmentRadius(headR,i,n);
    left[i] = {x:p.x+nx*rad, y:p.y+ny*rad};
    right[i] = {x:p.x-nx*rad, y:p.y-ny*rad};
  }
  const headTangent = Math.atan2(segs[0].y-segs[1].y, segs[0].x-segs[1].x);
  const hx=segs[0].x, hy=segs[0].y;
  const nose = {x: hx+Math.cos(headTangent)*headR*0.95, y: hy+Math.sin(headTangent)*headR*0.95};
  const tail = segs[n-1];
  const photoReady = pickedHeadStyle==='photo' && pickedHeadPhoto && previewPhotoImg.complete && previewPhotoImg.naturalWidth>0;

  if(pickedHeadStyle==='cobra'){
    pctx.fillStyle = pickedColor; pctx.globalAlpha = 0.55;
    pctx.beginPath();
    pctx.ellipse(hx,hy,headR*1.55,headR*0.9, headTangent+Math.PI/2, 0, Math.PI*2);
    pctx.fill(); pctx.globalAlpha = 1;
  }

  // ribbon body
  pctx.beginPath();
  pctx.moveTo(nose.x, nose.y);
  pctx.lineTo(left[0].x, left[0].y);
  for(let i=1;i<n;i++){
    const mx=(left[i-1].x+left[i].x)/2, my=(left[i-1].y+left[i].y)/2;
    pctx.quadraticCurveTo(left[i-1].x,left[i-1].y,mx,my);
  }
  pctx.lineTo(left[n-1].x,left[n-1].y);
  pctx.lineTo(tail.x,tail.y);
  pctx.lineTo(right[n-1].x,right[n-1].y);
  for(let i=n-1;i>0;i--){
    const mx=(right[i].x+right[i-1].x)/2, my=(right[i].y+right[i-1].y)/2;
    pctx.quadraticCurveTo(right[i].x,right[i].y,mx,my);
  }
  pctx.lineTo(right[0].x,right[0].y);
  pctx.closePath();
  pctx.fillStyle = pickedColor;
  pctx.fill();

  pctx.save();
  pctx.clip();
  pctx.strokeStyle = 'rgba(0,0,0,0.16)';
  pctx.lineWidth = Math.max(2, headR*0.55);
  pctx.beginPath(); pctx.moveTo(right[0].x,right[0].y);
  for(let i=1;i<n;i++) pctx.lineTo(right[i].x,right[i].y);
  pctx.stroke();
  pctx.strokeStyle = 'rgba(255,255,255,0.1)';
  pctx.lineWidth = Math.max(1.5, headR*0.3);
  pctx.beginPath(); pctx.moveTo(left[0].x,left[0].y);
  for(let i=1;i<n;i++) pctx.lineTo(left[i].x,left[i].y);
  pctx.stroke();
  pctx.strokeStyle = 'rgba(0,0,0,0.16)';
  pctx.lineWidth = 1.4;
  pctx.beginPath();
  for(let i=2;i<n-1;i+=3){ pctx.moveTo(left[i].x,left[i].y); pctx.lineTo(right[i].x,right[i].y); }
  pctx.stroke();
  pctx.fillStyle = 'rgba(0,0,0,0.15)';
  for(let i=3;i<n-3;i+=5){
    if(hash2(i*0.37,42)<0.4) continue;
    const rad = segmentRadius(headR,i,n);
    pctx.save(); pctx.translate(segs[i].x,segs[i].y); pctx.rotate(headTangent);
    pctx.beginPath(); pctx.ellipse(0,0,rad*0.9,rad*0.5,0,0,Math.PI*2); pctx.fill();
    pctx.restore();
  }
  pctx.restore();

  // Head: plain procedural circle + face, matching the in-game snake
  pctx.beginPath();
  pctx.fillStyle = pickedColor;
  pctx.arc(hx,hy,headR,0,Math.PI*2);
  pctx.fill();

  if(photoReady){
    pctx.save();
    pctx.beginPath(); pctx.arc(hx,hy,headR,0,Math.PI*2); pctx.clip();
    const img = previewPhotoImg;
    const scale = Math.max((headR*2)/img.naturalWidth, (headR*2)/img.naturalHeight);
    const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
    pctx.drawImage(img, hx-dw/2, hy-dh/2, dw, dh);
    pctx.restore();
    pctx.strokeStyle = pickedColor; pctx.lineWidth = 2.5;
    pctx.beginPath(); pctx.arc(hx,hy,headR,0,Math.PI*2); pctx.stroke();
  }

  if(!photoReady){
    if(pickedHeadStyle==='viper'){
      pctx.save(); pctx.translate(hx,hy); pctx.rotate(headTangent);
      pctx.fillStyle = 'rgba(0,0,0,0.28)';
      pctx.beginPath();
      pctx.moveTo(headR*0.55,0); pctx.lineTo(0,-headR*0.5);
      pctx.lineTo(-headR*0.4,0); pctx.lineTo(0,headR*0.5);
      pctx.closePath(); pctx.fill(); pctx.restore();
    } else if(pickedHeadStyle==='horned'){
      pctx.save(); pctx.translate(hx,hy); pctx.rotate(headTangent);
      pctx.fillStyle = pickedColor;
      pctx.beginPath();
      pctx.moveTo(-headR*0.3,-headR*0.75); pctx.lineTo(-headR*0.55,-headR*1.35); pctx.lineTo(-headR*0.05,-headR*0.8);
      pctx.closePath(); pctx.fill();
      pctx.beginPath();
      pctx.moveTo(-headR*0.3,headR*0.75); pctx.lineTo(-headR*0.55,headR*1.35); pctx.lineTo(-headR*0.05,headR*0.8);
      pctx.closePath(); pctx.fill(); pctx.restore();
    }

    // nostrils
    pctx.fillStyle = 'rgba(0,0,0,0.35)';
    const n1 = { x: nose.x + Math.cos(headTangent+1.2)*headR*0.35, y: nose.y + Math.sin(headTangent+1.2)*headR*0.35 };
    const n2 = { x: nose.x + Math.cos(headTangent-1.2)*headR*0.35, y: nose.y + Math.sin(headTangent-1.2)*headR*0.35 };
    pctx.beginPath(); pctx.arc(n1.x,n1.y,1.3,0,Math.PI*2); pctx.arc(n2.x,n2.y,1.3,0,Math.PI*2); pctx.fill();

    // eyes — iris + vertical slit pupil
    const eOff = headR*0.52, eFwd = headR*0.35, irisR = headR*0.24;
    [-1,1].forEach(side=>{
      const exx = hx + Math.cos(headTangent)*eFwd + Math.cos(headTangent+side*Math.PI/2)*eOff;
      const eyy = hy + Math.sin(headTangent)*eFwd + Math.sin(headTangent+side*Math.PI/2)*eOff;
      pctx.fillStyle = '#e8c467';
      pctx.beginPath(); pctx.arc(exx,eyy,irisR,0,Math.PI*2); pctx.fill();
      pctx.save(); pctx.translate(exx,eyy); pctx.rotate(headTangent+Math.PI/2);
      pctx.fillStyle = '#14100a';
      pctx.beginPath(); pctx.ellipse(0,0,irisR*0.32,irisR*0.85,0,0,Math.PI*2); pctx.fill();
      pctx.restore();
    });

    // occasional flicking forked tongue
    const cyclePos = (tSec*0.6) % 3.2;
    if(cyclePos < 0.4){
      const flick = Math.sin((cyclePos/0.4)*Math.PI);
      const len = headR*1.05*flick;
      const tx1 = nose.x+Math.cos(headTangent)*len, ty1 = nose.y+Math.sin(headTangent)*len;
      pctx.strokeStyle = '#c23a4a'; pctx.lineWidth = 1.3;
      pctx.beginPath(); pctx.moveTo(nose.x,nose.y); pctx.lineTo(tx1,ty1); pctx.stroke();
      pctx.beginPath();
      pctx.moveTo(tx1,ty1); pctx.lineTo(tx1+Math.cos(headTangent+0.35)*len*0.22, ty1+Math.sin(headTangent+0.35)*len*0.22);
      pctx.moveTo(tx1,ty1); pctx.lineTo(tx1+Math.cos(headTangent-0.35)*len*0.22, ty1+Math.sin(headTangent-0.35)*len*0.22);
      pctx.stroke();
    }
  }
}

/* ============================== PROFILE ============================== */
// Optional. Guests can hit "Slither in" straight away; a profile adds a name, a permanent photo head and lifetime stats.
const PROFILE_KEY = 'mossbite3d.profile.v1';
let storageOK = true;
(function probeStorage(){
  try{ localStorage.setItem('mossbite3d.probe','1'); localStorage.removeItem('mossbite3d.probe'); }
  catch(e){ storageOK = false; }
})();
function newStats(){ return { games:0, wins:0, deaths:0, food:0, seconds:0 }; }
function loadProfile(){
  if(!storageOK) return;
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(!p || typeof p.name !== 'string') return;
    const st = p.stats || {};
    profile = {
      name: p.name.slice(0,14) || 'Player',
      photo: typeof p.photo === 'string' ? p.photo : null,
      created: p.created || Date.now(),
      stats: { games:+st.games||0, wins:+st.wins||0, deaths:+st.deaths||0, food:+st.food||0, seconds:+st.seconds||0 }
    };
  }catch(e){ profile = null; }
}
function saveProfile(){
  if(!profile) return;
  try{ if(storageOK) localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
  catch(e){ storageOK = false; }
}
function deleteProfileData(){
  try{ localStorage.removeItem(PROFILE_KEY); }catch(e){}
  profile = null;
}
function fmtTime(sec){
  sec = Math.floor(sec);
  if(sec < 60) return sec + 's';
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + s + 's';
}
function fmtNum(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
window.addEventListener('pagehide', saveProfile);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') saveProfile(); });

/* ---------- DOM ---------- */
const profileScreen = document.getElementById('profileScreen');
const profileBtn = document.getElementById('profileBtn');
const pEdit = document.getElementById('pEdit'), pView = document.getElementById('pView');
const pName = document.getElementById('pName'), pMsg = document.getElementById('pMsg');
const pEditAvatar = document.getElementById('pEditAvatar'), pViewAvatar = document.getElementById('pViewAvatar');
const pPhotoInput = document.getElementById('pPhotoInput');
let draftPhoto = null;      // photo chosen in the editor (data URL) or null
let editing = false;

function avatarHTML(photo, big){
  return photo ? '<img alt="" src="' + photo + '">' : '<span>' + (big ? '🐍' : '🐍') + '</span>';
}
function renderProfileChip(){
  if(profile){
    profileBtn.className = 'profileChip has';
    profileBtn.innerHTML = '<span class="pAv">' + avatarHTML(profile.photo) + '</span><span class="pTxt"></span>';
    profileBtn.querySelector('.pTxt').textContent = profile.name + '  ·  Stats';
  } else {
    profileBtn.className = 'profileChip';
    profileBtn.innerHTML = '<span class="pAv">＋</span><span class="pTxt">Create profile</span>';
  }
}
/* the profile photo becomes the snake's head; picking a preset style overrides it for that game */
function profilePhotoAvailable(){ return !!(profile && profile.photo); }
function applyProfilePhoto(){
  if(!profilePhotoAvailable()) return;
  pickedHeadPhoto = profile.photo;
  pickedHeadStyle = 'photo';
  headRow.querySelectorAll('.styleBtn').forEach(function(n){ n.classList.remove('selected'); });
  photoHeadBtn.classList.add('selected');
  photoHeadStatus.textContent = 'Profile photo ✓';
  previewPhotoImg.src = pickedHeadPhoto;
}
function syncMenuWithProfile(){
  renderProfileChip();
  photoHeadBtn.textContent = profilePhotoAvailable() ? '📷 Use profile photo' : '📷 Use a Photo';
  if(profilePhotoAvailable()) applyProfilePhoto();
  else if(pickedHeadStyle === 'photo' && pickedHeadPhoto && !headPhotoInput.value){
    // profile photo was removed: fall back to the classic head
    pickedHeadPhoto = null; pickedHeadStyle = 'classic';
    photoHeadBtn.classList.remove('selected'); photoHeadStatus.textContent = '';
    headRow.querySelectorAll('.styleBtn').forEach(function(n){ n.classList.toggle('selected', n.dataset.style === 'classic'); });
    drawPreview();
  }
}

/* ---------- photo handling: centre-crop to a small square so it stores well ---------- */
function processPhoto(file, done){
  const reader = new FileReader();
  reader.onerror = function(){ done(null); };
  reader.onload = function(ev){
    const img = new Image();
    img.onerror = function(){ done(null); };
    img.onload = function(){
      const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d');
      const sc = Math.max(S/img.naturalWidth, S/img.naturalHeight);
      const dw = img.naturalWidth*sc, dh = img.naturalHeight*sc;
      g.fillStyle = '#222'; g.fillRect(0,0,S,S);
      g.drawImage(img, (S-dw)/2, (S-dh)/2, dw, dh);
      done(c.toDataURL('image/jpeg', 0.86));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- screens ---------- */
function showProfileScreen(){ profileScreen.style.display = 'flex'; }
function hideProfileScreen(){ profileScreen.style.display = 'none'; }
function setEditAvatar(){
  pEditAvatar.innerHTML = avatarHTML(draftPhoto, true) + '<div class="cam">' + (draftPhoto ? 'Change photo' : 'Add photo') + '</div>';
  document.getElementById('pRemovePhoto').style.display = draftPhoto ? '' : 'none';
}
function openEditor(){
  editing = true;
  pView.style.display = 'none'; pEdit.style.display = '';
  document.getElementById('pEditTitle').textContent = profile ? 'EDIT PROFILE' : 'CREATE PROFILE';
  document.getElementById('pCancel').textContent = profile ? 'Cancel' : 'Maybe later';
  pName.value = profile ? profile.name : '';
  draftPhoto = profile ? profile.photo : null;
  pMsg.textContent = storageOK ? '' : "Heads up: this browser is blocking storage, so the profile will only last until you close the page.";
  pMsg.className = 'pMsg' + (storageOK ? '' : ' warn');
  setEditAvatar();
  showProfileScreen();
}
function openView(){
  editing = false;
  pEdit.style.display = 'none'; pView.style.display = '';
  pViewAvatar.innerHTML = avatarHTML(profile.photo, true);
  document.getElementById('pViewName').textContent = profile.name;
  document.getElementById('pSince').textContent = 'Playing since ' + new Date(profile.created).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  const st = profile.stats;
  document.getElementById('sGames').textContent = fmtNum(st.games);
  document.getElementById('sWins').textContent = fmtNum(st.wins);
  document.getElementById('sRate').textContent = st.games ? Math.round(st.wins/st.games*100) + '%' : '—';
  document.getElementById('sDeaths').textContent = fmtNum(st.deaths);
  document.getElementById('sFood').textContent = fmtNum(st.food);
  document.getElementById('sTime').textContent = fmtTime(st.seconds);
  document.getElementById('pNote').textContent = storageOK ? '' : 'Storage is blocked in this browser, so stats will reset when you close the page.';
  resetConfirms();
  showProfileScreen();
}
profileBtn.addEventListener('click', function(){ if(profile) openView(); else openEditor(); });
document.getElementById('pBack').addEventListener('click', hideProfileScreen);
document.getElementById('pEditBtn').addEventListener('click', openEditor);
document.getElementById('pCancel').addEventListener('click', function(){ if(profile) openView(); else hideProfileScreen(); });
pEditAvatar.addEventListener('click', function(){ pPhotoInput.click(); });
pPhotoInput.addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  processPhoto(f, function(url){
    if(!url){ pMsg.textContent = "Couldn't read that photo — try another."; pMsg.className = 'pMsg warn'; return; }
    draftPhoto = url; pMsg.textContent = ''; setEditAvatar();
  });
  pPhotoInput.value = '';
});
document.getElementById('pRemovePhoto').addEventListener('click', function(){ draftPhoto = null; setEditAvatar(); });
document.getElementById('pSave').addEventListener('click', function(){
  const name = pName.value.replace(/\s+/g,' ').trim();
  if(!name){ pMsg.textContent = 'Pick a name first.'; pMsg.className = 'pMsg warn'; pName.focus(); return; }
  if(profile){ profile.name = name; profile.photo = draftPhoto; }
  else profile = { name:name, photo:draftPhoto, created:Date.now(), stats:newStats() };
  saveProfile();
  syncMenuWithProfile();
  openView();
});
pName.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('pSave').click(); } });

/* two-tap confirms for the destructive actions */
const pResetBtn = document.getElementById('pResetStats'), pDeleteBtn = document.getElementById('pDelete');
let confirmTimers = {};
function resetConfirms(){
  pResetBtn.textContent = 'Reset stats'; pResetBtn.classList.remove('danger');
  pDeleteBtn.textContent = 'Delete profile'; pDeleteBtn.classList.remove('danger');
}
function twoTap(btn, idle, ask, action){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('danger')){ clearTimeout(confirmTimers[idle]); resetConfirms(); action(); return; }
    resetConfirms(); btn.classList.add('danger'); btn.textContent = ask;
    confirmTimers[idle] = setTimeout(resetConfirms, 3000);
  });
}
twoTap(pResetBtn, 'reset', 'Tap again to reset', function(){ profile.stats = newStats(); saveProfile(); openView(); });
twoTap(pDeleteBtn, 'del', 'Tap again to delete', function(){
  deleteProfileData(); syncMenuWithProfile(); hideProfileScreen();
});

/* ---------- stat hooks used by the game ---------- */
let profileSaveTimer = 0;
function profileTick(dt){
  if(!profile) return;
  profile.stats.seconds += dt;
  profileSaveTimer += dt;
  if(profileSaveTimer > 8){ profileSaveTimer = 0; saveProfile(); }
}

loadProfile();
syncMenuWithProfile();

/* ---------- keep the screen on while playing (helps tilt play), fullscreen button ---------- */
let wakeLock = null;
function requestWake(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; }); }).catch(function(){});
    }
  }catch(e){}
}
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && running) requestWake(); });
const fsBtn = document.getElementById('fsToggle');
const fsRoot = document.documentElement;
const canFs = !!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen) && !/iPhone|iPad|iPod/.test(UA);
if(!canFs) fsBtn.style.display = 'none';
fsBtn.addEventListener('click', function(){
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if(el){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else { (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot); }
});

function startGame(){
  requestWake();
  generateWorld(pickedMap);
  buildPlayers(pickedEnemyCount, pickedColor, pickedHeadStyle, pickedHeadPhoto, profile ? profile.name : 'You');
  if(profile){ profile.stats.games++; saveProfile(); }
  world.time = 0;
  food.length = 0;
  for(let i=0;i<MAX_FOOD;i++) spawnRandomFood();
  boostPickup = null; boostSpawnTimer = BOOST_SPAWN_INTERVAL;
  invisPickup = null; invisSpawnTimer = INVIS_SPAWN_INTERVAL * 0.5;
  bladePickup = null; bladeSpawnTimer = BLADE_SPAWN_INTERVAL * 0.4;
  for(const f of fxList){ globe.remove(f.sp); f.sp.material.dispose(); } fxList.length = 0;
  clearMoles();
  moleSpawnTimer = MOLE_INTERVAL;
  for(const s of players) s.cachedSegs = s.segments();
  camZoom = 1;
  snapCamera();
  running = true;
  gameOver = false;
}

document.getElementById('startBtn').addEventListener('click', function(){
  ensureAudio(); // unlock audio here, inside a guaranteed user gesture
  startScreen.style.display = 'none';
  startGame();
});

function endGame(winner){
  releaseWake();
  gameOver = true;
  running = false;
  if(winner===me) sfx.win(); else sfx.lose();
  if(winner===me && profile) profile.stats.wins++;
  saveProfile();
  document.getElementById('winnerName').textContent = winner===me ? ((profile ? profile.name : 'You') + '!') : winner.name;
  document.getElementById('winnerName').style.color = winner.color;
  const sorted = players.slice().sort((a,b)=>b.score-a.score);
  document.getElementById('finalBoard').innerHTML = sorted.slice(0, 10).map(p=>{
    return `<div class="rowScore ${p===me?'me':''}">
      <span class="dot" style="background:${p.color}; color:${p.color}"></span>
      <span class="nm">${p.name}</span>
      <span class="sc">${p.score}</span>
    </div>`;
  }).join('');
  endScreen.style.display = 'flex';
}

document.getElementById('retryBtn').addEventListener('click', function(){
  startGame();
  endScreen.style.display = 'none';
});

function toMenu(){
  saveProfile();
  releaseWake();
  running = false; gameOver = false;
  endScreen.style.display = 'none';
  startScreen.style.display = '';
  input.left = input.right = input.up = input.down = false;
  input.padLeft = input.padRight = input.padUp = input.padDown = false;
  input.dragX = input.dragY = 0;
  document.getElementById('toast').classList.remove('show');
  deathFlashEl.style.opacity = 0; myFlash = 0;
  menuBtn.classList.remove('confirm'); menuBtn.textContent = '☰ Menu';
}
// small in-game button: first tap asks, second tap leaves (so a stray tap can't end a run)
const menuBtn = document.getElementById('menuBtn');
let menuConfirmTimer = null;
menuBtn.addEventListener('click', function(){
  if(!running) return;
  if(menuBtn.classList.contains('confirm')){ clearTimeout(menuConfirmTimer); toMenu(); return; }
  menuBtn.classList.add('confirm'); menuBtn.textContent = 'Leave game?';
  menuConfirmTimer = setTimeout(()=>{ menuBtn.classList.remove('confirm'); menuBtn.textContent = '☰ Menu'; }, 2500);
});
document.getElementById('menuBigBtn').addEventListener('click', toMenu);

// test hook (harmless in production)
window.__mossbite = { adapt:adaptResolution, perf:()=>({resScale, pr:renderer.getPixelRatio(), gl2:renderer.capabilities.isWebGL2, mobile:IS_MOBILE}), tiltInfo:()=>({tiltOn,tiltSteer,tiltEvents}), simStep, snapCamera, get state(){ return { running, me, players, food, obstacles, camDist, get moles(){ return moles; }, spawnMoleNow:()=>spawnMole(world.time), worldRef:world, get pickups(){ return [boostPickup, invisPickup, bladePickup]; }, mkPickup:(k)=>{ const p=spawnPickup(k); if(k==='boost') boostPickup=p; else if(k==='invis') invisPickup=p; else bladePickup=p; return p; } }; }, startGame, renderer, scene, camera, globe };
})();
